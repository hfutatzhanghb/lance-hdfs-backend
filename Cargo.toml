[package]
name = "lance-hdfs-backend"
version = "0.2.0"
edition = "2024"
rust-version = "1.91.0"
authors = ["hfutatzhanghb"]
description = "HDFS storage backend for Lance with dataset reads and writes, atomic commits, and configurable Hadoop integration"
license = "Apache-2.0"
repository = "https://github.com/hfutatzhanghb/lance-hdfs-backend"
documentation = "https://docs.rs/lance-hdfs-backend"
readme = "README.md"
keywords = ["lance", "hdfs", "object-store", "storage"]
categories = ["database-implementations", "filesystem"]

[dependencies]
async-trait = "0.1"
bytes = "1.11.1"
futures = "0.3"
object_store = { version = "=0.14.1", default-features = false }
url = "2.5.7"
lance-core = { version = "=13.0.0-beta.7", default-features = false }
lance-io = { version = "=13.0.0-beta.7", default-features = false }
opendal = { version = "0.59.2", optional = true }
object_store_opendal = { version = "0.60.2", optional = true, features = ["send_wrapper"] }
lance-table = { version = "=13.0.0-beta.7", optional = true, default-features = false }

[dev-dependencies]
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
lance = { version = "=13.0.0-beta.7", default-features = false }
opendal = { version = "0.59.2", default-features = false, features = ["services-memory"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["hdfs", "commit-handler"]
hdfs = [
    "dep:opendal",
    "opendal/services-hdfs",
    "dep:object_store_opendal",
]
commit-handler = ["dep:lance-table"]

# Lance 13 is not on crates.io yet, so resolve the exact pins from `main`.
# Drop this section and publish once Lance 13.0.0 is released; crates.io
# rejects published crates that carry Git dependencies.
[patch.crates-io]
lance = { git = "https://github.com/lance-format/lance.git", branch = "main" }
lance-core = { git = "https://github.com/lance-format/lance.git", branch = "main" }
lance-io = { git = "https://github.com/lance-format/lance.git", branch = "main" }
lance-table = { git = "https://github.com/lance-format/lance.git", branch = "main" }
